<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#8b5cf6">
    <title>Offline · FocusFlow</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: #020617;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        main { max-width: 360px; }
        img { width: 64px; height: 64px; border-radius: 16px; }
        h1 { font-size: 22px; margin: 20px 0 8px; color: #fff; }
        p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin: 0 0 24px; }
        button {
            border: 0;
            border-radius: 12px;
            padding: 10px 20px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(to top right, #7c3aed, #4f46e5);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/icon-192x192.png" alt="FocusFlow">
        <h1>You're offline</h1>
        <p>FocusFlow needs a connection to load. Once a page is open, check-ins you make while offline are saved on this device and synced when you reconnect.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
